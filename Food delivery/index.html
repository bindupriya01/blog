<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Online Food Delivery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Advanced Online Food Delivery</h1>
        <nav>
            <button id="login-btn">Login</button>
            <button id="logout-btn" style="display:none">Logout</button>
        </nav>
    </header>
    <main>
        <section id="menu">
            <h2>Our Menu</h2>
            <div id="menu-items">
                <!-- Menu items will be injected by JavaScript -->
            </div>
        </section>
        <section id="order">
            <h2>Place an Order</h2>
            <form id="order-form">
                <label for="item">Select Item:</label>
                <select id="item">
                    <option value="">Choose an item</option>
                </select>
                <button type="submit">Order Now</button>
            </form>
            <div id="order-status"></div>
        </section>
        <section id="admin" style="display:none">
            <h2>Admin Section</h2>
            <form id="add-item-form">
                <label for="new-item-name">New Item Name:</label>
                <input type="text" id="new-item-name" required>
                <label for="new-item-price">Price:</label>
                <input type="number" id="new-item-price" required>
                <button type="submit">Add Item</button>
            </form>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
